<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Deva's Portfolio | Live Updates</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=JetBrains+Mono:wght@400&display=swap" rel="stylesheet">
    <style>
        /* --- DESIGN STYLES --- */
        body {
            background: #0f172a;
            color: #f1f5f9;
            font-family: 'Inter', sans-serif;
            padding: 40px;
            margin: 0;
            display: flex;
            justify-content: center;
        }

        .container { max-width: 900px; width: 100%; }

        h1 { font-size: 2.5rem; margin-bottom: 10px; background: linear-gradient(90deg, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        p.subtitle { color: #94a3b8; font-size: 1.1rem; margin-bottom: 40px; }

        /* --- GRID LAYOUT --- */
        .projects-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(100%, 1fr));
            gap: 20px;
        }
        @media(min-width: 768px) {
            .projects-grid { grid-template-columns: repeat(2, 1fr); }
        }

        /* --- PROJECT CARD --- */
        .project-card {
            background: #1e293b;
            border: 1px solid #334155;
            border-radius: 12px;
            padding: 24px;
            transition: all 0.3s ease;
            position: relative;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }
        
        .project-card:hover {
            transform: translateY(-5px);
            border-color: #818cf8;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.2);
        }

        /* --- BADGES & TEXT --- */
        .header-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px; }
        
        .badge {
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 0.75rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }
        
        /* Green Badge for New Projects */
        .badge-new { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.4); }
        /* Purple Badge for Updates */
        .badge-update { background: rgba(139, 92, 246, 0.2); color: #a78bfa; border: 1px solid rgba(139, 92, 246, 0.4); }

        .timestamp { font-size: 0.8rem; color: #64748b; font-family: 'JetBrains Mono', monospace; }
        
        .message { 
            font-family: 'JetBrains Mono', monospace; 
            font-size: 0.9rem; 
            color: #cbd5e1; 
            line-height: 1.6; 
            background: rgba(0,0,0,0.3);
            padding: 10px;
            border-radius: 6px;
        }

        /* --- LOADING STATE --- */
        .status-box { text-align: center; padding: 40px; color: #64748b; font-style: italic; border: 2px dashed #334155; border-radius: 12px; }
        .error { color: #ef4444; border-color: #ef4444; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Deva's Portfolio</h1>
        <p class="subtitle">Real-time updates directly from my code editor.</p>

        <h2 style="border-bottom: 1px solid #334155; padding-bottom: 10px; margin-bottom: 20px; font-size: 1.2rem; color: #e2e8f0;">
            📡 Live Code Activity
        </h2>
        
        <div id="project-container" class="projects-grid">
            <div class="status-box">Connecting to DevPulse Engine...</div>
        </div>
    </div>

    <script>
        // ----------------------------------------------------
        // ✅ YOUR UPDATED CONFIGURATION
        // ----------------------------------------------------
        const DEVPULSE_URL = "https://a30a76345f02.ngrok-free.app"; 
        const USERNAME = "deva";
        // ----------------------------------------------------

        async function fetchProjects() {
            const container = document.getElementById('project-container');
            
            try {
                // 1. Fetch data from your Python Backend
                console.log(`Fetching from: ${DEVPULSE_URL}/api/activity/${USERNAME}`);
                const response = await fetch(`${DEVPULSE_URL}/api/activity/${USERNAME}`);
                
                if (!response.ok) throw new Error("Backend connection failed");

                const data = await response.json();

                // 2. Clear "Loading..." text
                container.innerHTML = "";

                // 3. Handle Empty History
                if (data.history.length === 0) {
                    container.innerHTML = `
                        <div class="status-box">
                            No recent activity found.<br>
                            <span style="font-size:0.8rem">Push code to GitHub to see updates here!</span>
                        </div>`;
                    return;
                }

                // 4. Render Cards Loop
                data.history.forEach(item => {
                    // Decide Badge Style
                    const isNew = item.type.includes("NEW");
                    const badgeClass = isNew ? "badge-new" : "badge-update";
                    const badgeText = isNew ? "🚀 NEW PROJECT" : "🛠️ UPDATE";

                    // Create HTML Card
                    const card = `
                        <div class="project-card">
                            <div class="header-row">
                                <span class="badge ${badgeClass}">${badgeText}</span>
                                <span class="timestamp">${item.timestamp}</span>
                            </div>
                            <div class="message">${item.message}</div>
                        </div>
                    `;
                    
                    // Add to page
                    container.innerHTML += card;
                });

            } catch (error) {
                console.error("Error:", error);
                container.innerHTML = `
                    <div class="status-box error">
                        ⚠️ <strong>System Offline</strong><br>
                        Could not connect to DevPulse Engine.<br>
                        <span style="font-size:0.8rem">Make sure Python & Ngrok are running.</span>
                    </div>`;
            }
        }

        // Run immediately on page load
        fetchProjects();
    </script>

</body>
</html>
